# KinderFlow — local development stack (KF-S0-OPS-002)
#
# Backing services only. The API, worker, and web app run ON THE HOST for hot
# reload (Sprint 0 Guide 2.1) and connect to the ports published below.
#
# Images are pinned by tag AND digest (ADR-006). To move a version, change both
# and say why in the commit message.
#
# Run it through the script, which waits for health and prints credentials:
#     scripts/dev-setup.sh
#
# Raw compose, if you know what you want:
#     docker compose --env-file .env -f infrastructure/compose/dev.yml up -d
#     docker compose --env-file .env -f infrastructure/compose/dev.yml --profile tools up -d
#
# Healthcheck intervals are deliberately unhurried. This repository has
# documented, unexplained I/O slowness on some volumes (risks O-9 and R-13);
# aggressive timeouts produce flapping containers, not faster startups.

name: ${COMPOSE_PROJECT_NAME:-kinderflow}

services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    container_name: kf-postgres
    restart: unless-stopped
    # pg_stat_statements (M-000) must be preloaded or CREATE EXTENSION fails.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
    environment:
      POSTGRES_USER: ${KF_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${KF_POSTGRES_PASSWORD:?KF_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${KF_POSTGRES_DB:-kf_dev}
      # Consumed by the init script to create the M-000 roles.
      KF_DB_API_PASSWORD: ${KF_DB_API_PASSWORD:?KF_DB_API_PASSWORD is required}
      KF_DB_WORKER_PASSWORD: ${KF_DB_WORKER_PASSWORD:?KF_DB_WORKER_PASSWORD is required}
      KF_DB_MIGRATOR_PASSWORD: ${KF_DB_MIGRATOR_PASSWORD:?KF_DB_MIGRATOR_PASSWORD is required}
      KF_DB_AUDIT_WRITER_PASSWORD: ${KF_DB_AUDIT_WRITER_PASSWORD:?KF_DB_AUDIT_WRITER_PASSWORD is required}
    ports:
      - '${KF_POSTGRES_PORT:-5432}:5432'
    volumes:
      - kf_pg_data:/var/lib/postgresql/data
      # Runs only on first init of an empty volume.
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U "${KF_POSTGRES_USER:-postgres}" -d "${KF_POSTGRES_DB:-kf_dev}"',
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    container_name: kf-redis
    restart: unless-stopped
    # AOF on (Sprint 0 Guide 2.1): BullMQ jobs must survive a restart.
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${KF_REDIS_PORT:-6379}:6379'
    volumes:
      - kf_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest@sha256:d5ecbb067db3705fa953d79e1b7f81ef84038df67aba6c52825d8c02a1ea748a
    container_name: kf-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 5000
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '${KF_MAILPIT_SMTP_PORT:-1025}:1025'
      - '${KF_MAILPIT_UI_PORT:-8025}:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: kf-minio
    restart: unless-stopped
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${KF_MINIO_ROOT_USER:?KF_MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${KF_MINIO_ROOT_PASSWORD:?KF_MINIO_ROOT_PASSWORD is required}
    ports:
      - '${KF_MINIO_API_PORT:-9000}:9000'
      - '${KF_MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - kf_minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 15s

  # One-shot. Creates the buckets, then exits 0. Idempotent by construction:
  # `mb --ignore-existing` is a no-op on the second run.
  minio-bootstrap:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: kf-minio-bootstrap
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${KF_MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${KF_MINIO_ROOT_PASSWORD}
      KF_S3_BUCKET_MEDIA: ${KF_S3_BUCKET_MEDIA:-kf-media}
      KF_S3_BUCKET_BACKUPS: ${KF_S3_BUCKET_BACKUPS:-kf-backups}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        mc alias set kf http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "kf/$$KF_S3_BUCKET_MEDIA"
        mc mb --ignore-existing "kf/$$KF_S3_BUCKET_BACKUPS"
        echo "KinderFlow: buckets ready:"
        mc ls kf
    restart: 'no'

  pgadmin:
    image: dpage/pgadmin4:latest@sha256:2f4ce946ddf8360680d7eff4eaba1d91859eb6b4003e6623bad5c63a322c2f4d
    container_name: kf-pgadmin
    # Optional. Only starts with `--profile tools`.
    profiles: ['tools']
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${KF_PGADMIN_EMAIL:-dev@kinderflow.local}
      PGADMIN_DEFAULT_PASSWORD: ${KF_PGADMIN_PASSWORD:?KF_PGADMIN_PASSWORD is required}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      # pgAdmin validates the login address as if it had to receive mail and
      # rejects reserved TLDs: `.local` fails with "special-use or reserved
      # name". It never sends mail here — the address is only a local login —
      # so we allow-list the reserved domain rather than invent an address
      # that looks routable. The value is parsed as a Python literal.
      # (CHECK_EMAIL_DELIVERABILITY / GLOBALLY_DELIVERABLE do not cover this
      # case; the special-use allow-list is the knob that does.)
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: 'False'
      PGADMIN_LISTEN_PORT: 80
    ports:
      - '${KF_PGADMIN_PORT:-5050}:80'
    volumes:
      - kf_pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python3',
          '-c',
          "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:80/misc/ping'); sys.exit(0)",
        ]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 45s

volumes:
  kf_pg_data:
  kf_redis_data:
  kf_minio_data:
  kf_pgadmin_data:
